name: MSTest CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "project213/WorldCupPlanner/WorldCupPlanner.sln"

      - name: Build
        run: dotnet build "project213/WorldCupPlanner/WorldCupPlanner.sln" --configuration Release --no-restore

      - name: Test (MSTest)
        run: dotnet test "project213/WorldCupPlanner/WorldCupPlanner.sln" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mstest-results
          path: |
            **/*.trx
            **/TestResults/**

