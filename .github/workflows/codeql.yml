name: CodeQL

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    # Lunes 06:23 UTC: las consultas nuevas de CodeQL tambien revisan codigo que no cambio.
    - cron: '23 6 * * 1'

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'WorldCupPlanner.sln'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
