services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: worldcup-sqledge
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      # Solo loopback IPv4 (la clave de sa es publica en .env.example). El mapeo IPv6 de Docker no reenvia
      # bien a SQL Edge, por eso las cadenas de conexion usan 127.0.0.1 y no localhost.
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

  # Solo arranca con "docker compose --profile app up": sin el perfil, "docker compose up -d sqlserver"
  # sigue levantando unicamente la base.
  app:
    profiles: ["app"]
    build: .
    container_name: worldcup-app
    depends_on:
      - sqlserver
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=WorldCupPlanner;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      # Solo loopback, igual que la base: las cuentas de demo tienen claves publicas.
      - "127.0.0.1:8080:8080"
    # depends_on no espera a que SQL Edge acepte conexiones y la app migra la base al arrancar: si
    # todavia no responde, el proceso termina y este reinicio lo vuelve a intentar.
    restart: unless-stopped

volumes:
  mssql-data:
