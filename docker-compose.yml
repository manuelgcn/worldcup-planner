services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: worldcup-sqledge
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      # Solo loopback: la app corre en la misma maquina y la clave de sa es publica (.env.example).
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql-data:
